{% extends "base.html" %}

{% block title %}Password changed — Smart Queue{% endblock %}

{% block content %}
<div class="shell auth">
  <div class="auth__card">
    <div class="auth__strip">
      <span class="auth__strip-label">Done</span>
      <span class="auth__strip-num">&mdash;&mdash;</span>
    </div>

    <div class="auth__head">
      <h1 class="auth__title">Password changed</h1>
      <p class="auth__sub">Sign in with the new one.</p>
    </div>

    <div class="auth__body">
      <a class="btn btn--seal btn--block" href="{% url 'accounts:login' %}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
