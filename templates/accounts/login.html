{% extends "base.html" %}

{% block title %}Login | Smart Queue{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Login</h1>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  <p class="muted">No account yet? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
