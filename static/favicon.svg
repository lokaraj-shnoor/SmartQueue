<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Smart Queue">
  <!-- The masthead mark, shrunk: the lit panel with the bone Q on it. Drawn
       as geometry rather than type so it stays legible at 16px, where a
       serif letterform turns to mud. -->
