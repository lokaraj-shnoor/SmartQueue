  <circle cx="16" cy="15" r="7" fill="none" stroke="#f4f1e8" stroke-width="3.5"/>
  <path d="M18.5 19.5 L23 25" stroke="#f4f1e8" stroke-width="3.5" stroke-linecap="round"/>
</svg>
